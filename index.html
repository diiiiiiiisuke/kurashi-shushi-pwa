<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#123747" />
    <!-- 外部への通信・外部スクリプトを禁止する（家計データの流出防止）。変更する場合は docs/security.md を参照 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="毎日の家計簿・収支・返済シミュレーションをスマホで管理するPWA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="くらし収支" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <title>くらし収支</title>
  </head>
  <body>
    <header class="topbar">
      <div><p class="eyebrow">PERSONAL FINANCE</p><h1>くらし収支</h1></div>
      <button id="install" class="secondary" type="button" hidden>アプリを追加</button>
    </header>
    <main>
      <div class="month-control" id="monthControl">
        <button type="button" data-action="prev-month" aria-label="前の月">‹</button>
        <h2 id="monthLabel" aria-live="polite"></h2>
        <button type="button" data-action="next-month" aria-label="次の月">›</button>
      </div>
      <div id="view"></div>
    </main>
    <button type="button" class="fab" data-action="new-tx" aria-label="記録を追加">＋</button>
    <nav aria-label="メインメニュー">
      <button type="button" data-view="home">ホーム</button>
      <button type="button" data-view="records">記録</button>
      <button type="button" data-view="analysis">分析</button>
      <button type="button" data-view="debts">返済</button>
      <button type="button" data-view="settings">設定</button>
    </nav>
    <dialog id="sheet"><form id="sheetForm" novalidate></form></dialog>
    <div id="toast" class="toast" role="status" hidden></div>
    <input id="importFile" type="file" accept="application/json,.json" hidden />
    <noscript>JavaScript を有効にしてください。</noscript>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
