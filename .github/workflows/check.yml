name: check
on:
  push:
  pull_request:
# 読み取り専用（このワークフローはリポジトリを書き換えない）
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.3.1（改ざん対策のためコミットSHAで固定）
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      # Node はランナーに入っているものを使う（追加のアクションを使わない）
      - run: node --version
      - run: bash scripts/check.sh
